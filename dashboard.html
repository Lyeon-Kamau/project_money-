<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - M-Pesa Tracker</title>

    <!-- Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!--  PDF Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #16a34a 75%, #059669 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(51, 80, 94, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #16a34a 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { text-decoration: none; color: #eff1f5; }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            border: none;
        }
        .btn-success {
            background: linear-gradient(135deg, #16a34a 0%, #059669 100%);
            color: white;
        }
        .btn-secondary {
            background: white;
            border: 2px solid #e5e7eb;
        }
        .dashboard-container {
            padding: 2rem 5%;
            max-width: 1400px;
            margin: auto;
        }
        .content-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        .upload-area {
            border: 2px dashed #e5e7eb;
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="dashboard.html" class="logo">⌘ M-Pesa Tracker</a>
    <button class="btn btn-secondary" onclick="logout()">Logout</button>
</nav>

<div class="dashboard-container">

    <div class="content-card">
        <h2>Import M-Pesa Messages</h2>

        <div class="upload-area" onclick="document.getElementById('fileUpload').click()">
            <p style="font-size:3rem;">📤</p>
            <p>Click to upload</p>
            <p style="font-size:0.9rem; color:#888;">TXT, CSV, XML, or PDF files</p>

            <!--  PDF added -->
            <input type="file" id="fileUpload"
                   accept=".txt,.csv,.xml,.pdf"
                   style="display:none;"
                   onchange="handleFileUpload(event)">
        </div>

        <p style="text-align:center;margin:1rem 0;">OR</p>

        <textarea id="pasteArea" rows="4"
                  placeholder="Paste your M-Pesa SMS messages here..."></textarea>

        <button class="btn btn-success" style="margin-top:1rem;"
                onclick="handlePaste()">Import Messages</button>
    </div>

</div>

<script>
var transactions = [];

function logout() {
    localStorage.removeItem('mpesa_current_user');
    window.location.href = 'index.html';
}

function parseMPesaMessage(message) {
    var sent = /confirmed\.\s*ksh?([\d,]+\.?\d*)\s+sent to\s+([^.]+)/i;
    var received = /confirmed\.\s*ksh?([\d,]+\.?\d*)\s+received from\s+([^.]+)/i;

    var matchSent = message.match(sent);
    if (matchSent) {
        return {
            type: 'sent',
            amount: parseFloat(matchSent[1].replace(/,/g,'')),
            person: matchSent[2].trim(),
            date: new Date().toISOString().split('T')[0]
        };
    }

    var matchReceived = message.match(received);
    if (matchReceived) {
        return {
            type: 'received',
            amount: parseFloat(matchReceived[1].replace(/,/g,'')),
            person: matchReceived[2].trim(),
            date: new Date().toISOString().split('T')[0]
        };
    }

    return null;
}

function handlePaste() {
    var text = document.getElementById('pasteArea').value;
    var messages = text.split('\n').filter(line => line.trim());
    processMessages(messages);
}

function handleFileUpload(event) {
    var file = event.target.files[0];
    if (!file) return;

    //  PDF Handling
    if (file.name.toLowerCase().endsWith('.pdf')) {
        var reader = new FileReader();

        reader.onload = function(e) {
            var typedarray = new Uint8Array(e.target.result);

            pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                var textPromises = [];

                for (let i = 1; i <= pdf.numPages; i++) {
                    textPromises.push(
                        pdf.getPage(i).then(function(page) {
                            return page.getTextContent().then(function(content) {
                                return content.items.map(item => item.str).join(' ');
                            });
                        })
                    );
                }

                Promise.all(textPromises).then(function(pagesText) {
                    var fullText = pagesText.join('\n');
                    var messages = fullText.split(/(?=[A-Z0-9]{10}\s)/); 
                    processMessages(messages);
                });
            });
        };

        reader.readAsArrayBuffer(file);
        return;
    }

    // TXT, CSV, XML handling
    var reader = new FileReader();
    reader.onload = function(e) {
        var text = e.target.result;
        var messages = text.split('\n').filter(line => line.trim());
        processMessages(messages);
    };

    reader.readAsText(file);
}

function processMessages(messages) {
    var parsed = messages
        .map(msg => parseMPesaMessage(msg))
        .filter(t => t !== null);

    transactions = transactions.concat(parsed);
    localStorage.setItem('mpesa_transactions', JSON.stringify(transactions));

    alert('Successfully imported ' + parsed.length + ' transactions!');
}
</script>

</body>
</html>
